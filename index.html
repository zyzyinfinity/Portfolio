  <!-- Safety net: if content.js / app.js ever fails to run, don't leave the
       page stuck behind the curtain or with hidden sections. -->
  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        if (document.documentElement.dataset.booted === "1") return;
        var intro = document.getElementById("intro");
        if (intro) intro.style.display = "none";
        document.body.classList.add("intro-done");
        var hidden = document.querySelectorAll(".reveal");
        for (var i = 0; i < hidden.length; i++) hidden[i].classList.add("in");
        if (window.console) console.warn("[zyzy] boot did not complete — showing content without animation");
      }, 3000);
    });
  </script>
